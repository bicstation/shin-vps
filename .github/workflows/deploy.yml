name: SHIN CORE LINX｜Production Deploy

on:
  push:
    tags:
      - 'v*'

jobs:

  deploy:

    runs-on: ubuntu-latest

    timeout-minutes: 90

    steps:

      # ==========================================================
      # 📥 Checkout
      # ==========================================================

      - name: 📥 Checkout Repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0

      # ==========================================================
      # 🔎 Deployment Identity
      # ==========================================================

      - name: 🔎 Resolve Deployment Identity

        id: deployment

        shell: bash

        run: |

          set -e

          DEPLOY_SHA="$(git rev-parse HEAD)"
          DEPLOY_TAG="${GITHUB_REF_NAME}"

          echo ""
          echo "=================================================="
          echo "🔎 DEPLOYMENT IDENTITY"
          echo "=================================================="
          echo "TAG : ${DEPLOY_TAG}"
          echo "SHA : ${DEPLOY_SHA}"
          echo "=================================================="

          echo "deploy_sha=${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
          echo "deploy_tag=${DEPLOY_TAG}" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 🧹 Cleanup Local Artifacts
      # ==========================================================

      - name: 🧹 Cleanup Unnecessary Files

        shell: bash

        run: |

          set -e

          rm -rf \
            .git \
            .github \
            .venv \
            __pycache__ \
            node_modules \
            .next \
            */node_modules \
            */.next \
            */dist \
            */build

          echo ""
          echo "✅ Cleanup Complete"

      # ==========================================================
      # 🚀 Upload Source to VPS
      # ==========================================================

      - name: 🚀 Upload Source to VPS

        uses: appleboy/scp-action@v0.1.7

        with:

          host: ${{ secrets.SSH_HOST }}

          username: ${{ secrets.SSH_USER }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 2222

          source: "."

          target: "/home/maya/shin-vps"

          strip_components: 0

          overwrite: true

      # ==========================================================
      # 🚀 Production Deploy
      # ==========================================================

      - name: 🚀 Deploy to Production

        uses: appleboy/ssh-action@v1.0.3

        with:

          host: ${{ secrets.SSH_HOST }}

          username: ${{ secrets.SSH_USER }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 2222

          command_timeout: 90m

          script: |

            set -e

            cd /home/maya/shin-vps

            # ==================================================
            # 🔎 Deployment Identity
            # ==================================================

            DEPLOY_SHA="${{ steps.deployment.outputs.deploy_sha }}"
            DEPLOY_TAG="${{ steps.deployment.outputs.deploy_tag }}"

            echo ""
            echo "=================================================="
            echo "🚀 SHIN CORE LINX｜PRODUCTION DEPLOY"
            echo "=================================================="

            echo ""
            echo "📌 Deployment Identity"
            echo "   TAG : ${DEPLOY_TAG}"
            echo "   SHA : ${DEPLOY_SHA}"

            # ==================================================
            # 🔎 Source Verification
            # ==================================================

            echo ""
            echo "🔎 Source Verification"

            test -f docker-compose.yml
            test -f docker-compose.prod.yml
            test -f .env.production

            echo "✅ Docker Compose Files OK"
            echo "✅ Production Environment OK"

            # ==================================================
            # 🔎 Deployment Record
            # ==================================================

            echo ""
            echo "🔎 Recording Deployment Identity"

            mkdir -p .deployment

            printf '%s\n' "${DEPLOY_SHA}" \
              > .deployment/commit_sha

            printf '%s\n' "${DEPLOY_TAG}" \
              > .deployment/tag

            printf '%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
              > .deployment/deployed_at

            echo "✅ Deployment Identity Recorded"

            # ==================================================
            # 🌐 Shared Docker Network
            # ==================================================

            echo ""
            echo "🌐 Preparing Shared Network"

            docker network inspect shared-proxy \
              >/dev/null 2>&1 \
              || docker network create shared-proxy

            echo "✅ Shared Network Ready"

            # ==================================================
            # 🧹 Runtime Cache Cleanup
            # ==================================================

            echo ""
            echo "🧹 Cleaning Runtime Cache"

            find . \
              -type d \
              -name ".next" \
              ! -path "./postgres_data/*" \
              ! -path "./vps-data/*" \
              -prune \
              -exec rm -rf {} + \
              2>/dev/null || true

            echo "✅ Runtime Cache Cleaned"

            # ==================================================
            # 🔎 Docker Compose Validation
            # ==================================================

            echo ""
            echo "🔎 Validating Docker Compose"

            docker compose \
              -p shin-prod \
              --env-file .env.production \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              config \
              >/tmp/shin-prod-compose-config.txt

            echo "✅ Docker Compose Configuration OK"

            # ==================================================
            # 📦 Docker Build
            # ==========================================================

            echo ""
            echo "📦 Building Containers"

            docker compose \
              -p shin-prod \
              --env-file .env.production \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              build \
              --parallel \
              --no-cache

            echo ""
            echo "✅ Container Build Complete"

            # ==================================================
            # 🚀 Startup
            # ==================================================

            echo ""
            echo "🚀 Starting Containers"

            docker compose \
              -p shin-prod \
              --env-file .env.production \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d \
              --remove-orphans \
              --wait

            echo ""
            echo "✅ Containers Started"

            # ==================================================
            # 📦 Django Migration
            # ==================================================

            echo ""
            echo "📦 Running Django Migrations"

            docker compose \
              -p shin-prod \
              --env-file .env.production \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              exec -T django-v3 \
              python manage.py migrate --noinput

            echo ""
            echo "✅ Migration Complete"

            # ==================================================
            # 🎨 Django Static Files
            # ==================================================

            echo ""
            echo "🎨 Collecting Static Files"

            docker compose \
              -p shin-prod \
              --env-file .env.production \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              exec -T django-v3 \
              python manage.py collectstatic --noinput

            echo ""
            echo "✅ Static Complete"

            # ==================================================
            # 🩺 Health Checks
            # ==================================================

            echo ""
            echo "=================================================="
            echo "🩺 HEALTH CHECKS"
            echo "=================================================="

            # --------------------------------------------------
            # Django
            # --------------------------------------------------

            curl -fsS \
              https://api.bicstation.com/admin/ \
              >/dev/null

            echo "✅ Django Admin OK"

            # --------------------------------------------------
            # Tiper
            # --------------------------------------------------

            curl -fsS \
              https://tiper.live/ \
              >/dev/null

            echo "✅ Tiper OK"

            # --------------------------------------------------
            # AVFLASH
            # --------------------------------------------------

            curl -fsS \
              https://avflash.xyz/ \
              >/dev/null

            echo "✅ AVFLASH OK"

            # --------------------------------------------------
            # BIC STATION
            # --------------------------------------------------

            curl -fsS \
              https://bicstation.com/ \
              >/dev/null

            echo "✅ BICSTATION OK"

            # --------------------------------------------------
            # BIC SAVING
            # --------------------------------------------------

            curl -fsS \
              https://bic-saving.com/ \
              >/dev/null

            echo "✅ BIC SAVING OK"

            # ==================================================
            # 📊 Container Status
            # ==================================================

            echo ""
            echo "=================================================="
            echo "📊 CONTAINER STATUS"
            echo "=================================================="

            docker compose \
              -p shin-prod \
              --env-file .env.production \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              ps

            # ==================================================
            # 📄 Django Logs
            # ==================================================

            echo ""
            echo "=================================================="
            echo "📄 DJANGO LOGS"
            echo "=================================================="

            docker compose \
              -p shin-prod \
              --env-file .env.production \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              logs --tail=20 django-v3 \
              || true

            # ==================================================
            # 📄 BIC STATION Logs
            # ==================================================

            echo ""
            echo "=================================================="
            echo "📄 BIC STATION LOGS"
            echo "=================================================="

            docker compose \
              -p shin-prod \
              --env-file .env.production \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              logs --tail=20 next-bicstation-v3 \
              || true

            # ==================================================
            # 📄 Traefik Logs
            # ==================================================

            echo ""
            echo "=================================================="
            echo "📄 TRAEFIK LOGS"
            echo "=================================================="

            docker compose \
              -p shin-prod \
              --env-file .env.production \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              logs --tail=20 traefik \
              || true

            # ==================================================
            # 🔎 Deployment Verification
            # ==================================================

            echo ""
            echo "=================================================="
            echo "🔎 DEPLOYMENT VERIFICATION"
            echo "=================================================="

            echo ""
            echo "TAG:"
            cat .deployment/tag

            echo ""
            echo "SHA:"
            cat .deployment/commit_sha

            echo ""
            echo "DEPLOYED:"
            cat .deployment/deployed_at

            # ==================================================
            # 🔎 Production Source Verification
            # ==================================================

            echo ""
            echo "🔎 Production Source Verification"

            if [ -f next-bicstation/generate-sitemap.js ]; then

              echo "❌ Legacy sitemap generator still exists"

              exit 1

            else

              echo "✅ Legacy sitemap generator removed"

            fi

            # ==================================================
            # 🎉 Success
            # ==================================================

            echo ""
            echo "=================================================="
            echo "✅ SHIN CORE LINX DEPLOY SUCCESS"
            echo "=================================================="