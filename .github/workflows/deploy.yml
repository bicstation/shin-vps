name: SHIN CORE LINX｜Production Deploy

on:
  push:
    tags:
      - 'v*'

jobs:

  deploy:

    runs-on: ubuntu-latest

    timeout-minutes: 90

    env:
      PROJECT_NAME: shin-prod
      DEPLOY_PATH: /home/maya/shin-vps

      BASE_COMPOSE: docker-compose.yml
      PROD_COMPOSE: docker-compose.prod.yml

      ENV_FILE: .env.production

    steps:

      # ==========================================================
      # 📥 Checkout
      # ==========================================================
      - name: 📥 Checkout Repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0

      # ==========================================================
      # 🔎 Deployment Identity
      # ==========================================================
      - name: 🔎 Resolve Deployment Identity

        id: deployment

        shell: bash

        run: |

          set -e

          DEPLOY_SHA="$(git rev-parse HEAD)"
          DEPLOY_TAG="${GITHUB_REF_NAME}"

          echo "DEPLOY_SHA=${DEPLOY_SHA}"
          echo "DEPLOY_TAG=${DEPLOY_TAG}"

          echo "deploy_sha=${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
          echo "deploy_tag=${DEPLOY_TAG}" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 🧹 Cleanup Local Artifacts
      # ==========================================================
      - name: 🧹 Cleanup Unnecessary Files

        run: |

          rm -rf \
            .git \
            .github \
            .venv \
            __pycache__ \
            node_modules \
            .next \
            */node_modules \
            */.next \
            */dist \
            */build

          echo "✅ Cleanup Complete"

      # ==========================================================
      # 🚀 Upload Source
      # ==========================================================
      - name: 🚀 Upload Files to VPS

        uses: appleboy/scp-action@v0.1.7

        with:

          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222

          source: "."

          target: "/home/maya/shin-vps"

          strip_components: 0

          overwrite: true

      # ==========================================================
      # 🚀 Production Deploy
      # ==========================================================
      - name: 🚀 Deploy to Production

        uses: appleboy/ssh-action@v1.0.3

        with:

          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222

          command_timeout: 90m

          script: |

            set -e

            cd /home/maya/shin-vps

            DEPLOY_SHA="${{ steps.deployment.outputs.deploy_sha }}"
            DEPLOY_TAG="${{ steps.deployment.outputs.deploy_tag }}"

            echo ""
            echo "=================================================="
            echo "🚀 SHIN CORE LINX｜PRODUCTION DEPLOY"
            echo "=================================================="

            echo ""
            echo "📌 Deployment Identity"
            echo "   TAG : ${DEPLOY_TAG}"
            echo "   SHA : ${DEPLOY_SHA}"

            # ==================================================
            # 🔐 Git Repository State
            # ==================================================

            echo ""
            echo "🔐 Checking VPS Git Repository..."

            if [ ! -d ".git" ]; then

              echo "⚠️ VPS Git repository missing"

              git init

              git remote add origin \
                https://github.com/bicstation/shin-vps.git

            fi

            git remote set-url origin \
              https://github.com/bicstation/shin-vps.git

            echo "✅ VPS Git Repository Ready"

            # ==================================================
            # 🔎 Verify Source Deployment
            # ==================================================

            echo ""
            echo "🔎 Recording Deployment Identity..."

            mkdir -p .deployment

            printf '%s\n' "${DEPLOY_SHA}" \
              > .deployment/commit_sha

            printf '%s\n' "${DEPLOY_TAG}" \
              > .deployment/tag

            printf '%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
              > .deployment/deployed_at

            echo "✅ Deployment Identity Recorded"

            # ==================================================
            # 🌐 Shared Docker Network
            # ==================================================

            echo ""
            echo "🌐 Preparing Shared Network..."

            docker network inspect shared-proxy >/dev/null 2>&1 || \
            docker network create shared-proxy

            echo "✅ Shared Network Ready"

            # ==================================================
            # 🧹 Runtime Cache Cleanup
            # ==================================================

            echo ""
            echo "🧹 Cleaning Runtime Cache..."

            find . -type d -name ".next" \
              ! -path "./postgres_data/*" \
              ! -path "./vps-data/*" \
              -exec rm -rf {} + \
              2>/dev/null || true

            echo "✅ Runtime Cache Cleaned"

            # ==================================================
            # 📦 Docker Build
            # ==================================================

            echo ""
            echo "📦 Building Containers..."

            docker compose \
              -p "${PROJECT_NAME}" \
              --env-file "${ENV_FILE}" \
              -f "${BASE_COMPOSE}" \
              -f "${PROD_COMPOSE}" \
              build \
              --parallel \
              --no-cache

            echo "✅ Container Build Complete"

            # ==================================================
            # 🚀 Startup
            # ==================================================

            echo ""
            echo "🚀 Starting Containers..."

            docker compose \
              -p "${PROJECT_NAME}" \
              --env-file "${ENV_FILE}" \
              -f "${BASE_COMPOSE}" \
              -f "${PROD_COMPOSE}" \
              up -d \
              --remove-orphans \
              --wait

            echo "✅ Containers Started"

            # ==================================================
            # 📦 Django Migration
            # ==================================================

            echo ""
            echo "📦 Running Migrations..."

            docker compose \
              -p "${PROJECT_NAME}" \
              --env-file "${ENV_FILE}" \
              -f "${BASE_COMPOSE}" \
              -f "${PROD_COMPOSE}" \
              exec -T django-v3 \
              python manage.py migrate --noinput

            echo "✅ Migration Complete"

            # ==================================================
            # 🎨 Static Files
            # ==================================================

            echo ""
            echo "🎨 Collecting Static..."

            docker compose \
              -p "${PROJECT_NAME}" \
              --env-file "${ENV_FILE}" \
              -f "${BASE_COMPOSE}" \
              -f "${PROD_COMPOSE}" \
              exec -T django-v3 \
              python manage.py collectstatic --noinput

            echo "✅ Static Complete"

            # ==================================================
            # 🩺 Health Check
            # ==================================================

            echo ""
            echo "🩺 Running Health Checks..."

            curl -k -f \
              https://api.bicstation.com/admin/ \
              > /dev/null

            echo "✅ Django Admin OK"

            curl -fsS \
              https://tiper.live/ \
              > /dev/null

            echo "✅ Tiper OK"

            curl -fsS \
              https://avflash.xyz/ \
              > /dev/null

            echo "✅ AVFLASH OK"

            curl -fsS \
              https://bicstation.com/ \
              > /dev/null

            echo "✅ BICSTATION OK"

            curl -fsS \
              https://bic-saving.com/ \
              > /dev/null

            echo "✅ BIC SAVING OK"

            # ==================================================
            # 📊 Container Status
            # ==================================================

            echo ""
            echo "📊 Container Status"

            docker compose \
              -p "${PROJECT_NAME}" \
              --env-file "${ENV_FILE}" \
              -f "${BASE_COMPOSE}" \
              -f "${PROD_COMPOSE}" \
              ps

            # ==================================================
            # 📄 Django Logs
            # ==================================================

            echo ""
            echo "📄 Django Logs"

            docker compose \
              -p "${PROJECT_NAME}" \
              --env-file "${ENV_FILE}" \
              -f "${BASE_COMPOSE}" \
              -f "${PROD_COMPOSE}" \
              logs --tail=20 django-v3 || true

            # ==================================================
            # 📄 Next.js Logs
            # ==================================================

            echo ""
            echo "📄 Next.js Logs"

            docker compose \
              -p "${PROJECT_NAME}" \
              --env-file "${ENV_FILE}" \
              -f "${BASE_COMPOSE}" \
              -f "${PROD_COMPOSE}" \
              logs --tail=20 next-bicstation-v3 || true

            # ==================================================
            # 📄 Traefik Logs
            # ==================================================

            echo ""
            echo "📄 Traefik Logs"

            docker compose \
              -p "${PROJECT_NAME}" \
              --env-file "${ENV_FILE}" \
              -f "${BASE_COMPOSE}" \
              -f "${PROD_COMPOSE}" \
              logs --tail=20 traefik || true

            # ==================================================
            # 🔎 Deployment Verification
            # ==================================================

            echo ""
            echo "🔎 Deployment Verification"

            echo "TAG:"
            cat .deployment/tag

            echo ""
            echo "SHA:"
            cat .deployment/commit_sha

            echo ""
            echo "DEPLOYED:"
            cat .deployment/deployed_at

            echo ""
            echo "=================================================="
            echo "✅ SHIN CORE LINX DEPLOY SUCCESS"
            echo "=================================================="